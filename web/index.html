<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lar bakgrunnen gå helt ut i kantene på iPhone -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Ustastrikk</title>
    <meta name="description" content="Strikketeller med prosjekter, omganger og strikketid." />
    <!--
      Appen har en bevisst lys, koselig palett (som .preferredColorScheme(.light)
      i iOS-versjonen). Dette ber Dark Reader og liknende utvidelser om å la
      fargene være i fred. Slett linja hvis du heller vil ha automatisk mørk modus.
    -->
    <meta name="darkreader-lock" />

    <!-- PWA: legg til på Hjem-skjerm og kjør uten nettleserramme -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#f5edd9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ustastrikk" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="icon" href="icon-180.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
